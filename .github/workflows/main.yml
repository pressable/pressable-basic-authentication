name: PressableBasicAuthReleaseCI

on:
  push:
    branches:
      - main

env:
  PROJECT_NAME: pressable-basic-authentication
  VERSION_FILE_PATH: './pressable-basic-authentication.php'

jobs:
  build:
    name: Package Release Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # This job runs repository PHP (below) before publishing, so the
          # GITHUB_TOKEN is kept out of the local git config. The release script
          # receives it explicitly as an env var instead.
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The floor declared in readme.txt -- the gate should run against the
          # oldest version the plugin claims to support, not the runner's ambient one.
          php-version: '8.1'
          coverage: none

      # The release is published straight from this job, and no ordering exists
      # between separate workflow files, so the checks in test.yml cannot gate it
      # from outside -- a push that breaks them would still ship a Release. These
      # run here, ahead of the archive, so a failure stops the release rather than
      # being reported next to one.
      - name: Lint PHP files
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -- php -l

      - name: Hook registration regression test
        run: php tests/hook-registration-test.php

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.3'
          bundler-cache: true

      - name: Create ZIP Archive
        run: git archive --format zip --output ${{ env.PROJECT_NAME }}.zip --prefix ${{ env.PROJECT_NAME }}/ main -0

      - name: Install Octokit Gem
        run: gem install octokit

      - name: Run Release Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          REPO_SHA: ${{ github.sha }}
          VERSION_FILE_PATH: ${{ env.VERSION_FILE_PATH }}
          ZIP_FILE_NAME: ${{ env.PROJECT_NAME }}.zip
          PROJECT_ZIP_NAME: ${{ env.PROJECT_NAME }}.zip
        run: ruby ./.github/workflows/build.rb
